<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烬渊</title>
<link rel="stylesheet" href="css/style.css">
<!-- 没有站点图标：给一个空的，免得浏览器去请求 /favicon.ico（HTTP 下 404 会在控制台报错） -->
<link rel="icon" href="data:,">
<script>
  // 标题画面：地址带 ?play、window.__skipTitle 为真（测试脚本默认这样，见 test/harness.mjs）、或「新游戏」重载后留下的一次性标记时跳过。
  // 在这里先定下来（main.js 读 html 上的 title-on），标题画面不用等后面的脚本加载完就能画出来
  (function () {
    var skip = !!window.__skipTitle || /[?&]play\b/.test(location.search);
    try {
      skip = skip || !!sessionStorage.getItem('cinder-abyss-play-once');
    } catch (e) {
      /* 存储不可用就照常显示 */
    }
    if (!skip) document.documentElement.classList.add('title-on');
  })();
</script>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>

<!-- 世界层界面：脚下的生命 / 魔力弧、敌人名牌、指向画面外目标的箭头（内容由 ui.js 生成） -->
<div id="wui"></div>

<!-- 受伤 / 濒死红晕；濒死时屏幕边缘随心跳脉动 -->
<div id="vignette"></div>
<div id="lowlife"></div>

<!-- ============ HUD ============ -->
<div id="hud">

  <div id="zone-box">
    <div id="zone-name"></div>
    <div id="zone-sub"></div>
    <div id="seal-chips"></div>
    <div id="keyhints">
      <button type="button" class="kh" tabindex="-1" data-open="inv"><kbd>I</kbd>背包<b id="kh-new"></b></button>
      <button type="button" class="kh" tabindex="-1" data-open="skills"><kbd>G</kbd>技能</button>
      <button type="button" class="kh" tabindex="-1" data-open="tree"><kbd>P</kbd>天赋</button>
      <button type="button" class="kh" tabindex="-1" data-open="map"><kbd>M</kbd>地图</button>
      <button type="button" class="kh" tabindex="-1" data-open="help"><kbd>H</kbd>帮助</button>
    </div>
  </div>

  <div id="boss-box">
    <div id="boss-ail"></div>
    <div id="boss-name"></div>
    <div class="boss-bar">
      <div id="boss-trail"></div>
      <div id="boss-fill"></div>
      <div class="boss-ticks"></div>
      <div id="boss-num"></div>
    </div>
    <!-- 架势条：打空即破绽，可处决 -->
    <div class="boss-poise"><div id="boss-poise-fill"></div></div>
    <!-- 元素异常值：火 / 冰 / 雷，满了触发爆燃 / 冰缓 / 感电 -->
    <div class="boss-bu"><i class="fire"><b></b></i><i class="cold"><b></b></i><i class="light"><b></b></i></div>
    <div id="boss-break">破绽<kbd>F</kbd><span id="boss-break-txt">处决</span></div>
  </div>

  <!-- 连击计数 -->
  <div id="combo"><b id="combo-n"></b><span class="cb-label">连击</span><div class="cb-bar"><i id="combo-bar"></i></div></div>

  <!-- 拾取记录 -->
  <div id="feed"></div>

  <!-- 生命球 + 生命药剂 -->
  <div class="orb-wrap left">
    <div class="orb life">
      <div class="orb-fill" id="life-fill"></div>
      <div class="orb-res" id="life-res"></div>
      <div class="orb-gloss"></div>
      <div class="orb-text"><b id="life-num"></b><span id="life-max"></span></div>
    </div>
    <div class="flask life" id="flask-life">
      <div class="flask-body"><div class="pip"><i></i></div><div class="pip"><i></i></div><div class="pip"><i></i></div></div>
      <kbd>1</kbd>
    </div>
  </div>

  <!-- 魔力球 + 魔力药剂 -->
  <div class="orb-wrap right">
    <div class="flask mana" id="flask-mana">
      <div class="flask-body"><div class="pip"><i></i></div><div class="pip"><i></i></div><div class="pip"><i></i></div></div>
      <kbd>2</kbd>
    </div>
    <div class="orb mana">
      <div class="orb-fill" id="mana-fill"></div>
      <div class="orb-res" id="mana-res"></div>
      <div class="orb-gloss"></div>
      <div class="orb-text"><b id="mana-num"></b><span id="mana-max"></span></div>
    </div>
  </div>

  <!-- 底部中央：天赋提醒、技能栏、经验条 -->
  <div id="console">
    <button type="button" id="pp-remind" tabindex="-1" data-open="tree"></button>
    <div id="bar">
      <div id="dodge">
        <div class="d-icon"><span>翻</span><div class="d-cd"></div></div>
        <div class="s-key">空格</div>
      </div>
      <div class="bar-sep"></div>
      <div id="slots"></div>
    </div>
    <div id="xp">
      <span id="xp-lv"></span>
      <div class="xp-track"><div id="xp-fill"></div></div>
      <span id="xp-pct"></span>
    </div>
  </div>
</div>

<!-- 死亡遮罩 -->
<div id="death">
  <div class="death-inner">
    <div class="death-title">你倒下了</div>
    <div class="death-rule"></div>
    <div class="death-sub">余烬未冷 · 即将在区域入口重燃</div>
  </div>
</div>

<!-- ============ 面板 ============ -->
<div id="panel">
  <div id="panel-win">
    <div id="panel-head">
      <div class="brand"><i></i>烬渊</div>
      <div id="tabs"></div>
      <button type="button" id="panel-close" tabindex="-1" data-act="close"><kbd>Esc</kbd>关闭</button>
    </div>
    <div id="panel-body"></div>
  </div>
  <div id="picker"></div>
  <div id="confirm"></div>
</div>

<!-- 新手提示卡（面板打开时隐藏，由面板里的提示条接手） -->
<div id="coach"><div class="co-tag">提示</div><div class="co-body"></div><div class="co-ok">做到了</div></div>

<!-- 准星 -->
<div id="reticle" class="off"></div>

<!-- 开场卡片：首次进入时显示，游戏暂停 -->
<div id="intro">
  <div class="intro-card">
    <div class="intro-title">烬渊</div>
    <div class="intro-sub">余烬未冷</div>
    <div class="intro-keys">
      <div><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>移动</div>
      <div><span><kbd>右键</kbd></span>武器普攻（近战是连招）</div>
      <div><span><kbd>左键</kbd><kbd>Q</kbd><kbd>E</kbd></span>朝准星施放技能</div>
      <div><span><kbd>空格</kbd></span>翻滚闪避</div>
    </div>
    <p>沿着路一直向前，击败盘踞在尽头的首领。<br>装备、通货、宝石和天赋，会在用得上的时候再告诉你。</p>
    <button type="button" id="intro-go" class="btn primary" tabindex="-1">开始<kbd>Enter</kbd></button>
    <div class="intro-foot">随时按 <kbd>H</kbd> 查看完整帮助</div>
  </div>
</div>

<!-- 暂停菜单：没有面板开着时按 Esc 打开，游戏暂停（内容由 ui.js 填） -->
<div id="pause">
  <div class="pause-card">
    <div class="pause-title">暂停</div>
    <div class="m-menu" id="p-menu">
      <button type="button" class="m-btn primary" tabindex="-1" data-tact="resume"><b>继续</b><kbd>Esc</kbd></button>
      <button type="button" class="m-btn" tabindex="-1" data-tact="settings"><b>设置</b></button>
      <button type="button" class="m-btn" tabindex="-1" data-tact="help"><b>操作说明</b></button>
      <button type="button" class="m-btn" tabindex="-1" data-tact="menu"><b>返回主菜单</b><span>先存档</span></button>
    </div>
    <div class="m-host" id="p-view"></div>
  </div>
</div>

<!-- 标题画面：载入时显示（地址带 ?play 或 window.__skipTitle 为真时跳过）；背后是存档所在的区域，模拟不推进，镜头缓慢漂移 -->
<div id="title">
  <div class="t-shade"></div>
  <div class="t-veil"></div>
  <div class="t-main">
    <div class="t-logo">
      <svg class="t-emblem" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="t-fl" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff5a1c"/>
            <stop offset="0.55" stop-color="#ff9a3c"/>
            <stop offset="1" stop-color="#ffe2a8"/>
          </linearGradient>
          <linearGradient id="t-ring" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e6c58a"/>
            <stop offset="1" stop-color="#6b4a28"/>
          </linearGradient>
          <radialGradient id="t-pit" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#000" stop-opacity="0.9"/>
            <stop offset="1" stop-color="#000" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- 外环在下方断开：渊口 -->
        <path d="M44.5 107.5 A50 50 0 1 1 75.5 107.5" fill="none" stroke="url(#t-ring)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="60" cy="60" r="41" fill="none" stroke="#5e4329" stroke-width="1" stroke-dasharray="2 5"/>
        <path d="M60 4 l4 6 -4 6 -4 -6z M8 60 l6 -4 6 4 -6 4z M112 60 l-6 -4 -6 4 6 4z" fill="#b08650"/>
        <ellipse cx="60" cy="99" rx="26" ry="6" fill="url(#t-pit)"/>
        <path d="M34 99 Q60 93 86 99" fill="none" stroke="#ff7a2c" stroke-width="1.2" stroke-opacity="0.7"/>
        <!-- 从渊口升起的一簇余烬 -->
        <path class="t-flame" d="M60 96 C45 87 41 70 51 55 C52 64 56 67 59 62 C58 49 64 39 63 24 C77 38 83 59 75 78 C71 88 66 93 60 96Z" fill="url(#t-fl)"/>
        <path d="M60 92 C53 86 52 77 57 70 C58 75 61 76 62 72 C63 67 66 64 66 58 C71 66 72 77 68 85 C66 89 63 91 60 92Z" fill="#fff1d2" fill-opacity="0.75"/>
        <circle class="t-spark a" cx="44" cy="40" r="1.6" fill="#ffb066"/>
        <circle class="t-spark b" cx="78" cy="30" r="1.2" fill="#ffd28a"/>
        <circle class="t-spark c" cx="84" cy="52" r="1" fill="#ff8a3c"/>
      </svg>
      <div class="t-name">烬渊</div>
      <div class="t-sub">余烬未冷</div>
    </div>
    <div class="m-menu" id="t-menu">
      <button type="button" class="m-btn primary" tabindex="-1" id="t-continue" data-tact="continue"><b>继续游戏</b><span id="t-save"></span></button>
      <button type="button" class="m-btn" tabindex="-1" id="t-new" data-tact="new"><b>新游戏</b></button>
      <button type="button" class="m-btn" tabindex="-1" data-tact="settings"><b>设置</b></button>
      <button type="button" class="m-btn" tabindex="-1" data-tact="help"><b>操作说明</b></button>
      <div class="t-wait">余烬正在点燃……</div>
    </div>
    <div class="m-host" id="t-view"></div>
  </div>
  <div class="t-foot"><span>烬渊 v0.1.0 · 原创网页动作 RPG</span><button type="button" class="t-link" tabindex="-1" data-tact="credits">致谢</button></div>
</div>

<div id="drag-ghost"></div>

<div id="toasts"></div>
<div id="tip"></div>

<script src="vendor/three.min.js"></script>
<!-- three.js r128 自带的示例模块（非 module 版，examples/js）：后期处理与 glTF 解析 -->
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="js/data.js"></script>
<!-- CC0 素材包清单；各区域的贴图 / 模型包在进入区域时才加载（见 js/assets.js） -->
<script src="js/assets/index.js"></script>
<!-- 角色模型（Quaternius CC0，GLB 打成 base64）：开场就要用，同步引入；缺了就用程序化角色 -->
<script src="js/assets/chars.js"></script>
<!-- 特效贴图库（tools/gen-vfx-textures.mjs 程序化生成，打成 base64）：同步引入，js/vfx.js 解码成纹理、提供共用的特效着色器 -->
<script src="js/assets/vfx.js"></script>
<script src="js/assets.js"></script>
<script src="js/vfx.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/enemies.js"></script>
<script src="js/minions.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
